server:
  port: 8082

spring:
  application:
    name: novel-service


  datasource:
    url: jdbc:postgresql://localhost:5432/novel_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect